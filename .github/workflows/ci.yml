name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - run: npm install --global sfw@2.0.4
      - run: sfw pnpm install --frozen-lockfile
      - run: sfw pnpm check
      - run: docker compose build
