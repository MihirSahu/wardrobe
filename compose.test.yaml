# Credentials are interpolated from the Git-ignored .env by container-test.sh.
name: wardrobe-container-test
services:
  wardrobe:
    build:
      context: .
      args:
        UID: ${WARDROBE_TEST_UID:-1000}
        GID: ${WARDROBE_TEST_GID:-1000}
    ports:
      - "${WARDROBE_TEST_PORT:-3001}:3000"
    environment:
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - ./.state/container-test/data:/app/data
      - wardrobe_test_state:/app/state
    restart: "no"
    stop_grace_period: 35s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  wardrobe_test_state:
